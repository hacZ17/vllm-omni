# Diagnostic branch only. Do not merge.
env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60
steps:
- group: Default-MIOpen candidate quality and existing READY integration; diagnostic
    only
  steps:
  - label: 'DIAGNOSTIC ONLY: default MIOpen decoder parity and READY integration'
    agent_pool: mi300_1
    depends_on: '~'
    mirror_hardwares:
    - amdproduction
    grade: Blocking
    timeout_in_minutes: 45
    source_file_dependencies: ci_rocm
    env:
      QWEN_RUNTIME_PROFILE: '0'
      QWEN_RUNTIME_FULL_SUITE: '0'
      QWEN_RUNTIME_VARIANT: production_default_ready
      QWEN_RUNTIME_PRODUCTION_WARMUP: '1'
      QWEN_RUNTIME_VALIDATE_ONLY: '1'
      QWEN_RUNTIME_READY_INTEGRATION: '1'
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
    artifact_paths:
    - artifacts/runtime-profile-tts-production_default_ready/**/*
    commands:
    - python3 "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/.buildkite/amd/scripts/profile-qwen-runtime.py"
      tts
