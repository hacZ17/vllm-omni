# Diagnostic branch only. Do not merge.
env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60
steps:
- group: Validate existing PR10995 eager-MTP fix on ROCm; diagnostic only
  steps:
  - label: 'DIAGNOSTIC ONLY: tts full suite FAST plus PR10995 eager-MTP fix'
    agent_pool: mi300_2
    depends_on: '~'
    mirror_hardwares:
    - amdproduction
    grade: Blocking
    timeout_in_minutes: 90
    source_file_dependencies: ci_rocm
    env:
      QWEN_RUNTIME_PROFILE: '0'
      QWEN_RUNTIME_FULL_SUITE: '1'
      QWEN_RUNTIME_VARIANT: fast_kernel_fix
      MIOPEN_FIND_MODE: FAST
      QWEN_RUNTIME_KERNEL_FIX: '1'
    artifact_paths:
    - artifacts/runtime-profile-tts-fast_kernel_fix/**/*
    commands:
    - python3 "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/.buildkite/amd/scripts/profile-qwen-runtime.py"
      tts
