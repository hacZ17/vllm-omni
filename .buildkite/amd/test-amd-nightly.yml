# Diagnostic branch only. Do not merge: these are not qualification jobs.
env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60
steps:
  - group: "Qwen runtime profiling for build 17377 (diagnostic only)"
    steps:
      - label: "DIAGNOSTIC ONLY: async Qwen runtime trace"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 90
        source_file_dependencies: ci_rocm
        artifact_paths:
          - artifacts/runtime-profile-async/**/*
        commands:
          - python3 .buildkite/amd/scripts/profile-qwen-runtime.py async
      - label: "DIAGNOSTIC ONLY: no_async Qwen runtime trace"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 90
        source_file_dependencies: ci_rocm
        artifact_paths:
          - artifacts/runtime-profile-no_async/**/*
        commands:
          - python3 .buildkite/amd/scripts/profile-qwen-runtime.py no_async
      - label: "DIAGNOSTIC ONLY: tts Qwen runtime trace"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 90
        source_file_dependencies: ci_rocm
        artifact_paths:
          - artifacts/runtime-profile-tts/**/*
        commands:
          - python3 .buildkite/amd/scripts/profile-qwen-runtime.py tts
