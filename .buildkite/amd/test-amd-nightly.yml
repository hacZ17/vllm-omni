# Diagnostic branch only. Do not merge.
env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60
steps:
- group: Qwen full-suite runtime comparison for build 17377 (diagnostic only)
  steps:
  - label: 'DIAGNOSTIC ONLY: async full suite fast'
    agent_pool: mi300_2
    depends_on: '~'
    mirror_hardwares:
    - amdproduction
    grade: Blocking
    timeout_in_minutes: 90
    source_file_dependencies: ci_rocm
    env:
      QWEN_RUNTIME_PROFILE: '0'
      QWEN_RUNTIME_FULL_SUITE: '1'
      QWEN_RUNTIME_VARIANT: fast
      MIOPEN_FIND_MODE: FAST
    artifact_paths:
    - artifacts/runtime-profile-async-fast/**/*
    commands:
    - python3 "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/.buildkite/amd/scripts/profile-qwen-runtime.py"
      async
  - label: 'DIAGNOSTIC ONLY: async full suite fast_threads1'
